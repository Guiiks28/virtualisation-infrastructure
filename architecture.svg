<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Architecture du laboratoire de virtualisation</title>
  <desc id="desc">L'administrateur accède à vCenter, qui gère deux hôtes ESXi. Les deux hôtes accèdent à un stockage partagé NFS 3 fourni par un NAS créé à partir de l'ancien hôte Proxmox pve1. La VM alpine-demo sert au test de reprise. La haute disponibilité a été testée et fonctionne. ESXi 2 sert aux tests et aux migrations.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#587087"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2874b8"/></marker>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; fill: #183044; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { font-size: 15px; fill: #536b7e; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #60798d; }
      .head { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #536b7e; }
      .tiny { font-size: 12px; fill: #536b7e; }
      .card { stroke-width: 2; rx: 16; }
      .link { fill: none; stroke: #587087; stroke-width: 2.5; marker-end: url(#arrow); }
      .storageLink { fill: none; stroke: #2874b8; stroke-width: 2.5; marker-end: url(#arrowBlue); }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f4f7fa"/>
  <text x="56" y="58" class="title">Architecture du laboratoire de virtualisation</text>
  <text x="56" y="88" class="sub">vCenter, deux hôtes ESXi et stockage partagé NFS.</text>

  <!-- Management layer -->
  <text x="56" y="137" class="section">ADMINISTRATION</text>
  <rect x="70" y="160" width="250" height="100" class="card" fill="#ffffff" stroke="#9aabba"/>
  <circle cx="112" cy="210" r="23" fill="#eaf2f8"/>
  <path d="M103 215c2-8 16-8 18 0M108 204a4 4 0 1 0 8 0a4 4 0 1 0-8 0" fill="none" stroke="#55758e" stroke-width="2.2" stroke-linecap="round"/>
  <text x="150" y="202" class="head">Administrateur</text>
  <text x="150" y="229" class="small">Accès à l'interface de gestion</text>

  <rect x="420" y="160" width="300" height="100" class="card" fill="#e9f3ff" stroke="#4382bd"/>
  <rect x="451" y="188" width="38" height="38" rx="8" fill="#d2e7fb"/>
  <path d="M459 199h22M459 206h22M459 213h15" stroke="#2874b8" stroke-width="2.2" stroke-linecap="round"/>
  <text x="510" y="202" class="head">vCenter</text>
  <text x="510" y="229" class="small">Gestion centralisée des hôtes VMware</text>
  <path d="M320 210 H414" class="link"/>

  <!-- VMware environment -->
  <rect x="355" y="305" width="570" height="245" rx="22" fill="#eef8f2" stroke="#65a785" stroke-width="2"/>
  <text x="386" y="340" class="section" fill="#367a58">ENVIRONNEMENT VMWARE</text>
  <rect x="390" y="370" width="220" height="138" class="card" fill="#ffffff" stroke="#65a785"/>
  <rect x="414" y="392" width="40" height="34" rx="5" fill="#e2f2e9" stroke="#65a785" stroke-width="1.5"/>
  <path d="M419 402h30M419 410h30M419 418h30" stroke="#4b8c69" stroke-width="1.7"/>
  <text x="468" y="405" class="head">Hôte ESXi 1</text>
  <text x="414" y="452" class="body">VM de test</text>
  <rect x="414" y="464" width="165" height="28" rx="14" fill="#e8f2ff"/>
  <text x="496" y="483" text-anchor="middle" class="small" fill="#286ba6">alpine-demo</text>

  <rect x="665" y="370" width="220" height="138" class="card" fill="#ffffff" stroke="#65a785"/>
  <rect x="689" y="392" width="40" height="34" rx="5" fill="#e2f2e9" stroke="#65a785" stroke-width="1.5"/>
  <path d="M694 402h30M694 410h30M694 418h30" stroke="#4b8c69" stroke-width="1.7"/>
  <text x="743" y="405" class="head">Hôte ESXi 2</text>
  <text x="689" y="452" class="body">Hôte ajouté à vCenter</text>
  <text x="689" y="481" class="small">Hôte de test et de migration</text>

  <path d="M570 260 V285 H500 V364" class="link"/>
  <path d="M630 260 V285 H775 V364" class="link"/>
  <text x="640" y="294" class="tiny">vCenter administre les deux hôtes</text>

  <!-- Shared datastore -->
  <rect x="385" y="600" width="510" height="106" class="card" fill="#e9f3ff" stroke="#4382bd"/>
  <path d="M420 632h46a8 8 0 0 1 8 8v38a8 8 0 0 1-8 8h-46a8 8 0 0 1-8-8v-38a8 8 0 0 1 8-8z" fill="#d2e7fb" stroke="#4382bd" stroke-width="1.7"/>
  <path d="M420 644h54M420 658h54M420 672h54" stroke="#4382bd" stroke-width="1.7"/>
  <text x="495" y="641" class="head">Stockage partagé NFS 3</text>
  <text x="495" y="669" class="body">Banque de données vérifiée pendant l'exercice</text>
  <text x="495" y="692" class="small">Accessible par les hôtes ESXi selon la topologie du lab</text>
  <path d="M500 508 V565 H530 V594" class="storageLink"/>
  <path d="M775 508 V565 H750 V594" class="storageLink"/>

  <!-- NAS source -->
  <rect x="70" y="410" width="235" height="140" class="card" fill="#fff5e5" stroke="#c58a37"/>
  <path d="M96 443h42a6 6 0 0 1 6 6v36a6 6 0 0 1-6 6H96a6 6 0 0 1-6-6v-36a6 6 0 0 1 6-6z" fill="#ffebc7" stroke="#c58a37" stroke-width="1.5"/>
  <circle cx="101" cy="454" r="2.4" fill="#c58a37"/><circle cx="101" cy="466" r="2.4" fill="#c58a37"/><circle cx="101" cy="478" r="2.4" fill="#c58a37"/>
  <text x="157" y="451" class="head">pve1</text>
  <text x="91" y="514" class="body">Ancien hôte Proxmox</text>
  <text x="91" y="538" class="small">réutilisé comme NAS</text>
  <path d="M188 550 V575 H385" fill="none" stroke="#c58a37" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="203" y="570" class="tiny">fournit le partage NFS</text>

  <!-- Notes -->
  <rect x="950" y="330" width="205" height="220" rx="16" fill="#ffffff" stroke="#c7d2dc" stroke-width="1.5"/>
  <text x="975" y="368" class="head" font-size="16">À retenir</text>
  <circle cx="979" cy="401" r="4" fill="#4382bd"/>
  <text x="992" y="406" class="small">Reprise de</text>
  <text x="992" y="426" class="small">alpine-demo :</text>
  <text x="992" y="446" class="small">0 perte notée</text>
  <circle cx="979" cy="475" r="4" fill="#c58a37"/>
  <text x="992" y="480" class="small">Haute disponibilité :</text>
  <text x="992" y="500" class="small">testée, fonctionnelle</text>
  <circle cx="979" cy="526" r="4" fill="#65a785"/>
  <text x="992" y="531" class="small">ESXi 2 : tests et migrations</text>

</svg>

